name: Docker image

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "src/main/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fedlearnnet/orchestration-api/orch-api

jobs:
  image:
    # main -> latest, develop -> staging, feature/x -> feature-x, to try a branch without merging it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Dockerfile.jvm only copies target/quarkus-app, so the app is built once on the runner and
      # both architectures are assembled without emulation.
      - name: Build Quarkus application
        run: bash mvnw -B -ntp package -DskipTests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          case "$GITHUB_REF_NAME" in
            main) tag=latest ;;
            develop) tag=staging ;;
            *) tag="${GITHUB_REF_NAME//\//-}" ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$tag" \
            -t "$IMAGE:$tag-${GITHUB_SHA::7}" \
            -f src/main/docker/Dockerfile.jvm \
            --push .

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: image
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
