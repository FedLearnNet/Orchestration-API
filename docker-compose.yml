services:
  orch-api-db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orch-management
      POSTGRES_USER: user
    volumes:
      - orch-api-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d orch-management" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orch-network

  orch-api:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    user: "0:0"
    ports:
      - '8093:8080'
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://orch-api-db:5432/orch-management
      QUARKUS_DATASOURCE_USERNAME: user
      QUARKUS_DATASOURCE_PASSWORD: password
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: false
      CONTAINER_HOST_OVERRIDE: host.docker.internal
      CONTAINER_NETWORK_NAMES: orch-network
  #    PIPELINE_COSIGN_SIGN:
  #    PIPELINE_COSIGN_KEY:
  #    PIPELINE_IMAGE_TRUST_TOOLS_ENABLED:
  #    PIPELINE_IMAGE_TRUST_TOOLS_PUBLIC_KEY:
  #    PIPELINE_IMAGE_TRUST_PIPELINE_ENABLED:
  #    PIPELINE_IMAGE_TRUST_PIPELINE_PUBLIC_KEY:
      QUARKUS_LOG_CATEGORY_"bio.cosy.featurecloud"_LEVEL: DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orch-data:/mnt/input:rw
    #  - ./trust:/etc/fl-net/trust:ro
    depends_on:
      orch-api-db:
        condition: service_healthy
    networks:
      - orch-network
  
volumes:
  orch-api-db-volume:
  orch-data:
    name: "orch-data"

networks:
  orch-network:
    name: "orch-network"
    driver: bridge
