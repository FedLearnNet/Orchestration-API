quarkus.http.test-port=8083
quarkus.http.test-ssl-port=8446
quarkus.http.test-timeout=10s
quarkus.http.limits.max-body-size=1000M
quarkus.http.limits.max-form-attribute-size=100M
%dev.quarkus.http.port=8082


%dev,test.quarkus.log.console.json.enabled=false
%prod,staging.quarkus.log.console.json.enabled=false

quarkus.smallrye-openapi.info-title=FL-Net Orch-API
%dev.quarkus.smallrye-openapi.info-title=FL-Net Orch-API (development)
%test.quarkus.smallrye-openapi.info-title=FL-Net Orch-API (test)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Manage container orchestration, queries and general logging
quarkus.smallrye-openapi.info-terms-of-service=Your terms here
quarkus.smallrye-openapi.info-contact-email=simon.suewer@uni-hamburg.de
quarkus.smallrye-openapi.info-contact-name=Simon Süwer
quarkus.smallrye-openapi.info-contact-url=https://cosy.bio/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
%test,dev,staging.quarkus.swagger-ui.always-include=true


#database
%prod,staging.quarkus.datasource.db-kind = postgresql
%prod,staging.quarkus.datasource.username = user
# %prod,staging.quarkus.datasource.password = VIA ENV
%prod,staging.quarkus.datasource.jdbc.url = jdbc:postgresql://orch-db:5432/global-learning-management
# Flyway is the only schema owner in deployed environments. Hibernate validates
# the migrated schema but must never create, update, or drop deployed tables.
%prod,staging.quarkus.hibernate-orm.schema-management.strategy = validate
%prod,staging.quarkus.hibernate-orm.sql-load-script = no-file

%dev.quarkus.hibernate-orm.schema-management.strategy = update
%dev.quarkus.hibernate-orm.sql-load-script = no-file
%test.quarkus.hibernate-orm.schema-management.strategy = drop-and-create
%test.quarkus.hibernate-orm.sql-load-script = import-test.sql

# Flyway
quarkus.flyway.enabled=false
%prod,staging.quarkus.flyway.enabled=true
%prod,staging.quarkus.flyway.migrate-at-start=true
%prod,staging.quarkus.flyway.baseline-on-migrate=true

#docker
orch.docker.health-check=true
orch.docker.enabled=true
orch.docker.connect-timeout=10s
orch.docker.read-timeout=300s

orch.docker."featurecloud".registry-url=featurecloud.ai
orch.docker."featurecloud".enabled=true
#orch.docker."featurecloud".registry-username=simon.suewer@uni-hamburg.de
#orch.docker."featurecloud".registry-password= VIA ENV

orch.docker."gitlab".registry-url=gitlab.cosy.bio
orch.docker."gitlab".enabled=true
#orch.docker."gitlab".registry-username=simon.suewer@uni-hamburg.de
#orch.docker."gitlab".registry-password= VIA ENV

# Container config
# Optional system identity shared by resource names and the system_name Docker label.
# Blank: UUID generated once at startup; up to 16 characters: used directly; longer: SHA-256 prefix.
# Set a distinct, stable name per clinic to keep resource names stable across restarts.
# container.name=clinic1
%dev.container.host.override=host.docker.internal
container.auto-stop=true
#default is 512, so this is 32 times the default
container.memory.limit=17179869184
#default is 512, so this is 32 times the default
container.memory.swap=17179869184
#default is 1024, so this is double the default
container.cpu.shares=2048
%dev.container.enable.autokill=true
%dev.container.enable.oomkill-disable=true

### Handling network and network participants
# DEV ONLY
# Allows for apps to be started in bridge networks even if they shouldn't have internet access
container.network.always-bridge=false
%test,dev.container.network.always-bridge=true
# Learning API container joined to the dedicated network of every started app.
# Required format: <container>:<port>, e.g. local-learning-api:8080.
# Use the actual Docker container name; the port is removed for network attachment.
# container.network.learning=
# Same, but only joined when the app was started with needsFederatedLearningAccess. Required as
# soon as any federated app runs - typically the FeatureCloud controller.
# Required format: <container>:<port>, e.g. controller:8001.
# container.network.controller=
%prod.container.file-transfer-volume.name=orch-data
%prod.container.file-transfer-volume.path=/mnt/input
container.file-transfer.grant-users=nonroot
container.file-transfer.grant-group=nonroot

#cors
quarkus.http.cors.enabled=true
%dev,test.quarkus.http.cors.origins=/.*/
%prod,staging.quarkus.http.cors.origins=
# cors given via ENV

quarkus.flyway.baseline-on-migrate=true

%test.quarkus.flyway.clean-at-start=true

%dev.quarkus.flyway.clean-at-start=true

quarkus.flyway.migrate-at-start=true
